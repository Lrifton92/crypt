[package]
name = "crypt_cli"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Offline client for Crypt sales: keys, commitment, sealing, opening and every proof the template checks."

[[bin]]
name = "crypt"
path = "src/main.rs"

[dependencies]
crypt_core = { path = "../core" }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
tari_template_lib_types = "0.34.0"
zeroize = "1.7"
