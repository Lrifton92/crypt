name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job builds from the committed Cargo.lock (`--locked`): what CI tested is what ships.
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Formatting
        run: cargo fmt --all --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in dependencies (RustSec)
        run: cargo audit --deny warnings

  client:
    # The client side on its own: crypt_core (sealing, opening, proofs, property tests) and the CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Test crypt_core
        run: cargo test -p crypt_core --locked
      - name: Lint crypt_core
        run: cargo clippy -p crypt_core --all-targets --locked -- -D warnings
      - name: Test the crypt CLI (a whole sale through the binary)
        run: cargo test -p crypt_cli --locked
      - name: Lint the crypt CLI
        run: cargo clippy -p crypt_cli --all-targets --locked -- -D warnings

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the template
        run: cargo build -p crypt --release --target wasm32-unknown-unknown --locked
      - name: Lint
        run: cargo clippy -p crypt --release --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Report the artefact size
        run: ls -l target/wasm32-unknown-unknown/release/crypt.wasm

  end-to-end:
    # Every sale outcome (end_to_end.rs) and every attack in THREAT_MODEL.md (attacks.rs), played
    # against a simulated Ootle ledger with the real client and a hostile template.
    # Linux only: the engine pulls a Cranelift JIT that does not build on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Play every sale
        run: cargo test -p crypt --test end_to_end --locked
      - name: Play every attack
        run: cargo test -p crypt --test attacks --locked
      - name: Check the demo's rules port against the template
        run: cargo test -p crypt --test equivalence --locked
